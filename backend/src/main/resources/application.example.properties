# Systivex example configuration — safe to commit. Contains no secrets.
#
# Local use: copy this file to `application.properties` in the same directory
# and adjust locally. The live `application.properties` is git-ignored
# (see root .gitignore) and must never be committed.
spring.application.name=systivex

# --- Phase 1: PostgreSQL + Flyway + JPA ---
# Point the URL/username at your local database. The password always comes
# from the environment (SYSTIVEX_DB_PASSWORD) — never write it into the
# local properties file either if you can avoid it.
# Windows PowerShell for the current session:
#   $env:SYSTIVEX_DB_PASSWORD="<your local systivex_app password>"
spring.datasource.url=jdbc:postgresql://localhost:5432/systivex
spring.datasource.username=systivex_app
spring.datasource.password=${SYSTIVEX_DB_PASSWORD:}

# Flyway is the schema authority; Hibernate only validates the migrated schema.
# Never use update/create/create-drop here.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Phase 3A: observability (metrics + tracing + correlated logs) ---
# Health plus a Prometheus-compatible scrape endpoint; the control plane
# emits traces but nothing consumes or stores them here yet.
management.endpoints.web.exposure.include=health,prometheus
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
# Metrics travel via the Prometheus scrape endpoint only (no OTLP metrics push),
# logs stay on the console (no OTLP log export) - both deferred deliberately.
management.otlp.metrics.export.enabled=false
management.logging.export.otlp.enabled=false
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]
