# gateway-service example configuration — safe to commit, no secrets.
# Copy to `application.properties` in the same directory for local runs.
# (The live file is git-ignored by the root .gitignore convention.)
spring.application.name=gateway-service
server.port=8081

# Downstream order-service base URL (overridable per environment).
app.order-service.url=${ORDER_SERVICE_URL:http://localhost:8082}

# --- Phase 3A: observability (metrics + tracing + correlated logs) ---
# Actuator exposes health plus a Prometheus-compatible scrape endpoint.
management.endpoints.web.exposure.include=health,prometheus
# Sample every trace locally; OTLP spans go to the collector (see
# observability/docker-compose.yml). Override per environment, never secrets.
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
# Metrics travel via the Prometheus scrape endpoint only (no OTLP metrics push),
# logs stay on the console (no OTLP log export) - both deferred deliberately.
management.otlp.metrics.export.enabled=false
management.logging.export.otlp.enabled=false
# Correlate each log line with the active trace/span (blank outside requests).
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]
