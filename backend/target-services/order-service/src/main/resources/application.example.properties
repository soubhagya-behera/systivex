# order-service example configuration — safe to commit, no secrets.
# Copy to `application.properties` in the same directory for local runs.
# (The live file is git-ignored by the root .gitignore convention.)
spring.application.name=order-service
server.port=8082

# Downstream base URLs (overridable per environment).
app.inventory-service.url=${INVENTORY_SERVICE_URL:http://localhost:8084}
app.payment-service.url=${PAYMENT_SERVICE_URL:http://localhost:8083}

# --- Phase 2B: service-owned PostgreSQL (order_db) ---
# The password always comes from the environment (ORDER_DB_PASSWORD) — never
# write it into the local properties file either if you can avoid it.
# Windows PowerShell for the current session:
#   $env:ORDER_DB_PASSWORD="<your local order_app password>"
spring.datasource.url=jdbc:postgresql://localhost:5432/order_db
spring.datasource.username=order_app
spring.datasource.password=${ORDER_DB_PASSWORD:}

# Flyway is the schema authority; Hibernate only validates the migrated schema.
# Never use update/create/create-drop here.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
