# inventory-service example configuration — safe to commit, no secrets.
# Copy to `application.properties` in the same directory for local runs.
# (The live file is git-ignored by the root .gitignore convention.)
spring.application.name=inventory-service
server.port=8084

# --- Phase 2B: service-owned PostgreSQL (inventory_db) ---
# The password always comes from the environment (INVENTORY_DB_PASSWORD) —
# never write it into the local properties file either if you can avoid it.
# Windows PowerShell for the current session:
#   $env:INVENTORY_DB_PASSWORD="<your local inventory_app password>"
spring.datasource.url=jdbc:postgresql://localhost:5432/inventory_db
spring.datasource.username=inventory_app
spring.datasource.password=${INVENTORY_DB_PASSWORD:}

# Flyway is the schema authority; Hibernate only validates the migrated schema.
# Never use update/create/create-drop here.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Phase 3A: observability (metrics + tracing + correlated logs) ---
# Actuator exposes health plus a Prometheus-compatible scrape endpoint.
management.endpoints.web.exposure.include=health,prometheus
# Sample every trace locally; OTLP spans go to the collector (see
# observability/docker-compose.yml). Override per environment, never secrets.
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
# Metrics travel via the Prometheus scrape endpoint only (no OTLP metrics push).
management.otlp.metrics.export.enabled=false
# Phase 3B-2: logs ALSO ship over OTLP/HTTP to the collector, which forwards
# them to Loki. Console output is unchanged (see logging.pattern.level).
management.logging.export.otlp.enabled=true
management.opentelemetry.logging.export.otlp.endpoint=${OTEL_LOGGING_ENDPOINT:http://localhost:4318/v1/logs}
# Correlate each log line with the active trace/span (blank outside requests).
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]
