# payment-service example configuration — safe to commit, no secrets.
# Copy to `application.properties` in the same directory for local runs.
# (The live file is git-ignored by the root .gitignore convention.)
spring.application.name=payment-service
server.port=8083

# --- Phase 2B: service-owned PostgreSQL (payment_db) ---
# The password always comes from the environment (PAYMENT_DB_PASSWORD) — never
# write it into the local properties file either if you can avoid it.
# Windows PowerShell for the current session:
#   $env:PAYMENT_DB_PASSWORD="<your local payment_app password>"
spring.datasource.url=jdbc:postgresql://localhost:5432/payment_db
spring.datasource.username=payment_app
spring.datasource.password=${PAYMENT_DB_PASSWORD:}

# Flyway is the schema authority; Hibernate only validates the migrated schema.
# Never use update/create/create-drop here.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
