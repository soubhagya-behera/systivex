name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:

# Least privilege: the workflow only needs to read the repository.
permissions:
  contents: read

# Cancel superseded runs on the same ref to keep CI fast and cheap.
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Build and test (Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      # The full suite uses Testcontainers PostgreSQL; the GitHub-hosted Ubuntu
      # runner provides a Docker daemon, so no extra service configuration is needed.
      - name: Run backend test suite
        run: ./mvnw -B clean test

  target-services:
    name: Target services (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service:
          - gateway-service
          - order-service
          - payment-service
          - inventory-service
    defaults:
      run:
        working-directory: backend/target-services/${{ matrix.service }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Run target-service test suite
        run: ./mvnw -B clean test

  loopback-config:
    name: Loopback configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Verify loopback-only configuration
        run: node scripts/verify-loopback.mjs
