name: Frontend CI

on:
  push:
    branches:
      - main
  pull_request:

# Least privilege: the workflow only needs to read the repository.
permissions:
  contents: read

# Cancel superseded runs on the same ref to keep CI fast and cheap.
concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Test and build (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Reproducible install from the committed lockfile.
      - name: Install dependencies
        run: npm ci

      # Dependency vulnerability gate (fails the job on known advisories).
      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Run frontend test suite
        run: npm test

      - name: Build production bundle
        run: npm run build
