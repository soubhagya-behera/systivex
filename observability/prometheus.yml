# Systivex Phase 3B-1: Prometheus scrape configuration (local development only).
#
# Single metrics path, unchanged from Phase 3A:
#   apps --/actuator/prometheus--> OTel Collector --:8889--> Prometheus.
# The collector remains the ONLY scraper of the Java services (see
# otel-collector.yml); Prometheus scrapes the collector's exposition only,
# so no duplicate collection path is created. Per-service identity on this
# path comes from the receiver-kept server_port label (mapped to service
# below), because the collector stamps service_name="systivex" on every
# scraped app metric.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets:
          - otel-collector:8889
    # The collector stamps every app metric with its own scrape-job resource
    # (service_name="systivex"), so per-service identity on this path lives
    # in the receiver-kept server_port label. Map it once here to a friendly
    # low-cardinality service label for dashboards and ad-hoc queries.
    metric_relabel_configs:
      - source_labels: [server_port]
        regex: "8080"
        target_label: service
        replacement: "control-plane"
      - source_labels: [server_port]
        regex: "8081"
        target_label: service
        replacement: "gateway-service"
      - source_labels: [server_port]
        regex: "8082"
        target_label: service
        replacement: "order-service"
      - source_labels: [server_port]
        regex: "8083"
        target_label: service
        replacement: "payment-service"
      - source_labels: [server_port]
        regex: "8084"
        target_label: service
        replacement: "inventory-service"
